const SlotStore = (() => {
  const KEY = 'slot.standalone.v1';
  let queue = Promise.resolve();
  const serial = operation => { const next = queue.then(operation); queue = next.catch(() => {}); return next; };

    let raw;
    try { raw = localStorage.getItem(KEY); }
    catch { throw Error('Browser storage is unavailable. Allow local file storage or open Slot in another browser profile.'); }
    if (raw === null) return {raw, db: SlotCore.empty()};
    try { return {raw, db: SlotCore.validateDatabase(JSON.parse(raw))}; }
    catch { throw Error('Saved Slot data is unreadable. It has been preserved. Restore a valid JSON backup; do not clear browser data if you need recovery.'); }
  }
  function write(db, previous) {
    try {
      if (localStorage.getItem(KEY) !== previous) throw Error('Slot changed in another tab. Refresh and try again.');
      localStorage.setItem(KEY, JSON.stringify(db));
    } catch (error) {
      if (error.name === 'QuotaExceededError') throw Error('Browser storage is full. This change was not saved. Export a backup and free storage before retrying.');
      if (error.name === 'SecurityError') throw Error('Browser storage is blocked. This change was not saved.');
      throw error;
    }
  }
  const locked = operation => navigator.locks?.request ? navigator.locks.request(KEY, operation) : operation();
  function request(url, method = 'GET', data) {
    return serial(() => locked(async () => {
      const {raw, db} = read();
      const result = await SlotCore.dispatch(db, url, method, data);
      if (method !== 'GET') write(db, raw);
      return SlotCore.clone(result);
    }));
  }
  const backup = () => serial(() => locked(() => ({app: 'Slot', version: 1, exported_at: new Date().toISOString(), data: read().db})));
  function parseBackup(text) {
    if (typeof text !== 'string' || text.length > 10 * 1024 * 1024) throw Error('Choose a Slot JSON backup smaller than 10 MB.');
    let value;
    try { value = JSON.parse(text); } catch { throw Error('This file is not valid JSON.'); }
    if (!value || value.app !== 'Slot' || value.version !== 1) throw Error('Choose a JSON backup exported by standalone Slot.');
    return SlotCore.validateDatabase(value.data);
  }

    return serial(() => locked(() => {
      const clean = SlotCore.validateDatabase(db);

      write(clean, localStorage.getItem(KEY));

  if(file.size>10*1024*1024)throw Error('Choose a Slot JSON backup smaller than 10 MB.');
  const data=SlotStore.parseBackup(await file.text());
  if(!confirm(`Restore ${file.name}? This replaces ALL Slot data in this browser with ${data.tasks.length} tasks, ${data.blocks.length} work blocks, and ${data.commitments.length} commitments. Export a backup first if you need the current data.`)){notice('Restore cancelled.');return;}
  await SlotStore.restore(data);$('edit-dialog').close();$('commitment-dialog').close();await changed('Backup restored. All dates and work history are available.');
 });
};
window.addEventListener('storage',event=>{if(event.key===SlotStore.key)notice('Slot data changed in another tab. Use Refresh before continuing.');});


let slotView='day';
function setSlotView(view,focus=true){
 if(!['day','week','tasks','settings'].includes(view))return;
 let reload=false;
 if(view==='week'){
  weekStart=weekStart||$('day').value;
  reload=$('day').value!==weekStart;
  $('day').value=weekStart;
  if(reload)defaults();
 }
 slotView=view;
 for(const name of ['day','week','tasks','settings'])$('slot-'+name).hidden=name!==view;
 $('date-label').textContent=view==='week'?'Starts':'Plan for';
 $('planner-title').textContent=view==='week'?'Plan your week.':'Plan your day.';
 root.querySelectorAll('.view-nav [data-slot-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.slotView===view)));
 if(focus){root.host.closest('.workspace-panel').scrollTo(0,0);const section=$('slot-'+view);section.tabIndex=-1;section.focus({preventScroll:true});}
 if(reload)run(async()=>{await refresh();notice('');});
}
root.addEventListener('click',event=>{
 const button=event.target.closest('[data-slot-view]');
 if(button&&!button.disabled){setSlotView(button.dataset.slotView);if(button.hasAttribute('data-add-task'))$('task-form').elements.name.focus();}
 if(event.target.closest('#refresh,#push'))root.querySelector('.more-actions').open=false;
});
root.addEventListener('invalid',event=>{const details=event.target.closest('details');if(details)details.open=true;},true);
const taskForm=$('task-form');let customChunks=false;
taskForm.elements.target_date.addEventListener('change',()=>{if(taskForm.elements.target_date.value)taskForm.elements.deadline.value=taskForm.elements.target_date.value+(taskForm.elements.deadline.value.slice(10)||'T17:00');});
['min_chunk','max_chunk'].forEach(key=>taskForm.elements[key].addEventListener('input',()=>customChunks=true));
taskForm.elements.duration.addEventListener('input',()=>{
 if(customChunks)return;
 const duration=Number(taskForm.elements.duration.value);
 if(Number.isInteger(duration)&&duration>0){taskForm.elements.min_chunk.value=Math.min(25,duration);taskForm.elements.max_chunk.value=Math.min(60,duration);}
});
root.host.addEventListener('studybuddy:deactivate',()=>{root.querySelectorAll('dialog[open]').forEach(dialog=>dialog.close());root.querySelector('.more-actions').open=false;});

})(root);
</script></body></html>
