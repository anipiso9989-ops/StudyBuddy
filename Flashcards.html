/* Terminal-inspired interface */
:root{color-scheme:dark;background:#101010;color:#e8e8e8}
html,body{min-height:100%;background:#101010}
body{font-size:15px;line-height:1.5}
#app{max-width:1060px;padding:28px 36px 72px}
.top{border-bottom:1px solid #383838;padding-bottom:18px;min-height:42px}
.brand{color:#e3e3e3;font-size:13px;letter-spacing:.06em}
.brand::before{content:'~/';color:#8d8d8d}
.brand::after{content:'_';animation:blink 1.25s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.action{color:#bdbdbd;font-size:12px;letter-spacing:.035em}
.action::before{content:'[';color:#777777;margin-right:1px}
.action::after{content:']';color:#777777;margin-left:1px}
.action:hover,.brand:hover,.deck-title:hover{color:#ffffff}
.action:focus-visible,.brand:focus-visible,.deck-title:focus-visible{outline:1px solid #e3e3e3;outline-offset:5px}
.primary{border:0;color:#eeeeee}
.danger:hover{color:#cccccc}
.page{margin-top:70px}
.eyebrow,.tiny,.side-label,.meta,.summary,.hint{font-size:12px;letter-spacing:.055em;color:#8c8c8c}
.eyebrow::before{content:'// ';color:#a7a7a7}
h1{font-size:clamp(38px,6.5vw,78px);letter-spacing:-.065em;line-height:1.05;margin-bottom:26px}
.summary{gap:26px}
.decks{margin-top:60px}
.deck-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:25px;padding:22px 0;border-top:1px solid #333333}
.deck-row:last-child{border-bottom:1px solid #333333}
.deck-title{font-size:clamp(25px,3.4vw,40px);letter-spacing:-.055em;margin:0;font-weight:700}
.deck-title::before{content:'> ';color:#b4b4b4;font-weight:400}
.deck-row .summary{justify-content:flex-end;min-width:170px}
.empty{font-size:16px;color:#999999}
.line-input,.bulk-input,.edit-input,.edit-area{background:#171717;color:#e8e8e8;border:1px solid #555555;padding:13px 15px;border-radius:0;caret-color:#e3e3e3}
.line-input:focus,.bulk-input:focus,.edit-input:focus,.edit-area:focus{outline:1px solid #e3e3e3;outline-offset:0;border-color:#e3e3e3}
.line-input{font-size:clamp(22px,3vw,35px)}
.bulk-input{font-family:"Cascadia Mono Web","Cascadia Mono",Consolas,monospace;min-height:300px}
input::placeholder,textarea::placeholder{color:#858585;opacity:1}
.field{margin-top:34px}.field label::before{content:'$ ';color:#b4b4b4}
.deck-tools{margin-top:35px}.cards{margin-top:65px}
.card-row{border-color:#333333;padding:25px 0;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
.card-row:last-child{border-bottom:1px solid #333333}
.rendered{font-size:16px}.rendered code,.rendered pre{background:#232323;color:#dddddd}
.study{min-height:calc(100dvh - 150px)}
.study-center{max-width:840px;padding:65px 0}
.study-front{font-size:clamp(29px,5vw,57px);letter-spacing:-.055em}
.study-back{font-size:clamp(24px,3.8vw,42px);border-color:#383838}
.study-actions{border-top:1px solid #383838;padding-top:18px}
.utility{border-color:#383838}.status{color:#e3e3e3}
.error{color:#cccccc}
::selection{background:#555555;color:#fff}
@media(max-width:650px){#app{padding:20px 20px 56px}.page{margin-top:55px}.decks{margin-top:45px}.deck-row{grid-template-columns:1fr;gap:8px}.deck-row .summary{justify-content:flex-start}.card-row{grid-template-columns:1fr}.study{min-height:calc(100dvh - 110px)}.study-center{padding:48px 0}.top-actions{gap:10px}}
@media(prefers-reduced-motion:reduce){.brand::after{animation:none}}

/* Legibility and navigation refinements */
.action{color:#ededed;font-size:13px;line-height:1.35;min-height:40px;padding:10px 3px;font-weight:700}
.action::before,.action::after{color:#b0b0b0}
.action:hover,.action:focus-visible{color:#fff;background:#292929}
.action:disabled{opacity:.48;background:transparent}
.primary{color:#fff}.danger{color:#d0d0d0}
.meta,.summary,.eyebrow,.side-label{color:#b5b5b5}
.card-actions{opacity:1;gap:12px}.card-actions .action{font-size:12px;min-height:40px;padding:8px 3px}
.pagination{display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid #383838;padding:18px 0}
.hint{margin-top:22px}.status:empty{display:none}
@media(max-width:650px){.action{font-size:12px}.card-actions{justify-content:flex-start}.pagination .meta{text-align:center}}

/* Keep flipping and grading controls usable on narrow screens. */
.study-actions{flex-wrap:wrap;align-items:center}
.study-actions .row-actions{gap:24px}

<body><div id="app"></div><input id="import-file" class="sr-only" type="file" accept="application/json,.json"><script>
'use strict';
// Storage: one atomic snapshot per change, serialized to preserve write order.
const DB='flashcards-local-v1', STORE='state', KEY='main', DAY=86400000, STEPS=[1,3,7,14,30,60,120];
let db, decks=[], view={name:'home'}, session=null, pendingWrite=Promise.resolve(), notice='', cardPage=0, grading=false;
const PAGE_SIZE=40;
const app=document.getElementById('app'), fileInput=document.getElementById('import-file');
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const due=c=>Number(c.due)<=Date.now();
const count=d=>d.cards.reduce((n,c)=>n+Number(due(c)),0);
const findDeck=()=>decks.find(d=>d.id===view.id);
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function read(){return new Promise((resolve,reject)=>{const r=db.transaction(STORE).objectStore(STORE).get(KEY);r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
function write(snapshot){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(snapshot,KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
function save(){const snapshot=structuredClone(decks);pendingWrite=pendingWrite.catch(()=>{}).then(()=>write(snapshot));return pendingWrite.then(()=>true,()=>{notice='Could not save changes. Check browser storage permissions.';render();return false})}
function flash(message){notice=message;render()}
// Rendering: escape raw HTML before Markdown; sanitize final HTML as defense in depth.
function rich(source){const parts=[], token=(html)=>{const i=parts.push(html)-1;return 'MATHPLACEHOLDER'+i+'END'};let s=String(source).replace(/\$\$([\s\S]*?)\$\$|(?<!\\)\$([^$\n]+)\$/g,(whole,block,inline)=>{if(!window.katex)return whole;try{return token(katex.renderToString(block??inline,{displayMode:block!==undefined,throwOnError:false,trust:false,strict:'ignore'}))}catch{return whole}});s=esc(s);let html=window.marked?marked.parse(s,{breaks:true,gfm:true}):s.replace(/\n/g,'<br>');html=html.replace(/MATHPLACEHOLDER(\d+)END/g,(_,i)=>parts[+i]||'');if(window.DOMPurify)html=DOMPurify.sanitize(html,{USE_PROFILES:{html:true},FORBID_TAGS:['style','iframe','form','input','button']});else html=html.replace(/<[^>]*>/g,'');return html}
function safeLinks(){app.querySelectorAll('.rendered a').forEach(a=>{if(!/^https?:$|^mailto:$/.test(a.protocol)){a.removeAttribute('href')}else{a.target='_blank';a.rel='noopener noreferrer'}})}
function shell(inner,right=''){app.innerHTML=`<header class="top"><button class="brand" data-go="home">FLASHCARDS</button><div class="top-actions">${right}</div></header>${inner}<p class="status" role="status">${esc(notice)}</p>`;safeLinks()}
function home(){shell(`<main class="page"><p class="eyebrow">${decks.length} ${decks.length===1?'DECK':'DECKS'}</p>${decks.length?`<section class="decks" aria-label="Decks">${decks.map(d=>`<article class="deck-row"><button class="deck-title" data-open="${esc(d.id)}">${esc(d.name)}</button><div class="summary"><span>${d.cards.length} CARDS</span><span>${count(d)} DUE</span></div></article>`).join('')}</section>`:'<p class="empty">No decks yet. Start with a name and a few cards.</p>'}</main><footer class="utility"><button class="action" data-export>EXPORT</button><button class="action" data-import>IMPORT</button></footer>`,`<button class="action" data-go="create">+ NEW DECK</button>`)}
function parseBulk(value){const cards=[], errors=[];value.split(/\r?\n/).forEach((line,i)=>{if(!line.trim())return;const at=line.indexOf('::');if(at<0||!line.slice(0,at).trim()||!line.slice(at+2).trim())errors.push(i+1);else cards.push({front:line.slice(0,at).trim(),back:line.slice(at+2).trim()})});return {cards,errors}}
function bulkView(){const adding=view.name==='add',d=adding&&findDeck();if(adding&&!d)return navigate('home');shell(`<main class="page form"><p class="eyebrow">${adding?esc(d.name):'NEW DECK'}</p><h1>${adding?'ADD CARDS':'CREATE DECK'}</h1><form id="bulk-form">${adding?'':`<div class="field"><label class="tiny" for="deck-name">DECK NAME</label><input class="line-input" id="deck-name" maxlength="160" required autocomplete="off" placeholder="Name your deck"></div>`}<div class="field"><label class="tiny" for="bulk">ONE CARD PER LINE · FRONT::BACK</label><textarea class="bulk-input" id="bulk" spellcheck="false" placeholder="Capital of France?::Paris\nDerivative of $x^n$::$nx^{n-1}$"></textarea><div id="parse-error" class="error" role="alert"></div></div><div class="form-footer"><span id="valid-count" class="meta">0 VALID CARDS</span><button class="action primary" type="submit">${adding?'ADD CARDS':'CREATE DECK'} →</button></div></form></main>`,`<button class="action" data-go="${adding?'deck':'home'}" ${adding?`data-id="${esc(d.id)}"`:''}>CANCEL</button>`);document.getElementById('bulk').addEventListener('input',updateBulk);document.getElementById('bulk-form').addEventListener('submit',submitBulk);(adding?document.getElementById('bulk'):document.getElementById('deck-name')).focus()}
function updateBulk(){const {cards,errors}=parseBulk(document.getElementById('bulk').value);document.getElementById('valid-count').textContent=`${cards.length} VALID ${cards.length===1?'CARD':'CARDS'}`;document.getElementById('parse-error').textContent=errors.length?`Fix line${errors.length===1?'':'s'} ${errors.slice(0,15).join(', ')}${errors.length>15?'…':''}: each card needs a front and back separated by ::.`:'';return {cards,errors}}
async function submitBulk(e){e.preventDefault();const {cards,errors}=updateBulk();if(errors.length)return;if(!cards.length){document.getElementById('parse-error').textContent='Enter at least one valid card.';return}const adding=view.name==='add',d=adding?findDeck():{id:uid(),name:document.getElementById('deck-name').value.trim(),cards:[]};if(!d.name){document.getElementById('deck-name').focus();return}const now=Date.now();d.cards.push(...cards.map(c=>({id:uid(),...c,interval:0,due:now,lastReviewed:null})));if(!adding)decks.push(d);if(!await save())return;notice=`${cards.length} ${cards.length===1?'card':'cards'} saved.`;navigate('deck',d.id)}
function deckView(){const d=findDeck();if(!d)return navigate('home');cardPage=Math.min(cardPage,Math.max(0,Math.ceil(d.cards.length/PAGE_SIZE)-1));const start=cardPage*PAGE_SIZE,visible=d.cards.slice(start,start+PAGE_SIZE);shell(`<main class="page"><p class="eyebrow">DECK</p><div id="deck-heading"><h1>${esc(d.name)}</h1></div><div class="summary"><span>${d.cards.length} CARDS</span><span>${count(d)} DUE</span></div><div class="deck-tools"><button class="action primary" data-go="study" data-id="${esc(d.id)}" ${count(d)?'':'disabled'}>STUDY →</button><button class="action" data-go="cram" data-id="${esc(d.id)}" ${d.cards.length?'':'disabled'}>CRAM →</button><button class="action" data-go="add" data-id="${esc(d.id)}">+ ADD CARDS</button><button class="action" data-export-deck>EXPORT</button><button class="action" data-rename>RENAME</button><button class="action danger" data-delete-deck>DELETE DECK</button></div>${count(d)?'':'<p class="hint">NO CARDS DUE RIGHT NOW</p>'}<section class="cards" aria-label="Cards">${d.cards.length?visible.map((c,i)=>`<article class="card-row" data-card="${esc(c.id)}"><div class="card-side"><div class="side-label">${String(start+i+1).padStart(2,'0')} / FRONT</div><div class="rendered">${rich(c.front)}</div></div><div class="card-side"><div class="side-label">BACK</div><div class="rendered">${rich(c.back)}</div></div><div class="card-actions"><button class="action" data-edit="${esc(c.id)}" aria-label="Edit card ${start+i+1}">EDIT</button><button class="action danger" data-delete-card="${esc(c.id)}" aria-label="Delete card ${start+i+1}">DELETE</button></div></article>`).join(''):'<p class="empty">No cards in this deck.</p>'}</section>${d.cards.length>PAGE_SIZE?`<nav class="pagination" aria-label="Card pages"><button class="action" data-page="prev" ${cardPage?'':'disabled'}>← PREVIOUS</button><span class="meta">${start+1}–${Math.min(start+PAGE_SIZE,d.cards.length)} / ${d.cards.length}</span><button class="action" data-page="next" ${start+PAGE_SIZE<d.cards.length?'':'disabled'}>NEXT →</button></nav>`:''}</main>`,`<button class="action" data-go="home">← ALL DECKS</button>`)}
function editCard(id){const d=findDeck(),c=d?.cards.find(x=>x.id===id),row=app.querySelector(`[data-card="${CSS.escape(id)}"]`);if(!c||!row)return;row.innerHTML=`<div class="card-side"><label class="side-label" for="edit-front">FRONT</label><textarea class="edit-area" id="edit-front"></textarea></div><div class="card-side"><label class="side-label" for="edit-back">BACK</label><textarea class="edit-area" id="edit-back"></textarea></div><div class="edit-actions"><button class="action primary" data-save-card="${esc(id)}">SAVE</button><button class="action" data-cancel-edit>CANCEL</button></div>`;row.querySelector('#edit-front').value=c.front;row.querySelector('#edit-back').value=c.back;row.querySelector('#edit-front').focus()}
function rename(){const d=findDeck(),heading=document.getElementById('deck-heading');heading.innerHTML='<label class="sr-only" for="rename-input">Deck name</label><input class="line-input" id="rename-input" maxlength="160"><div class="edit-actions"><button class="action primary" data-save-name>SAVE</button><button class="action" data-cancel-edit>CANCEL</button></div>';const input=document.getElementById('rename-input');input.value=d.name;input.focus();input.select()}
function reviewFace(c){return `<div class="side-label">${session.revealed?'BACK':'FRONT'}</div><div class="study-front"><div class="rendered">${rich(session.revealed?c.back:c.front)}</div></div>`}
function reviewActions(){return `<button class="action primary" data-flip>SHOW ${session.revealed?'FRONT':'ANSWER'} · SPACE</button>${session.revealed?'<div class="row-actions">'+(view.name==='cram'?'<button class="action primary" data-cram-next>NEXT CARD →</button>':'<button class="action" data-grade="miss">← DON\'T KNOW</button><button class="action primary" data-grade="know">KNOW →</button>')+'</div>':''}`}
function studyView(){const d=findDeck();if(!d)return navigate('home');const cram=view.name==='cram';if(!session||session.deckId!==d.id||session.mode!==view.name){const cards=cram?d.cards:d.cards.filter(due);session={deckId:d.id,mode:view.name,queue:cards.map(c=>c.id),initial:cards.length,done:0,revealed:false}}const c=d.cards.find(x=>x.id===session.queue[0]);if(!c&&session.queue.length){session.queue.shift();return studyView()}if(!c){if(cram){navigate('deck',d.id);flash('Cram complete. Start again whenever you like.');return}shell(`<main class="study"><div class="completion"><p class="eyebrow">SESSION COMPLETE</p><h1>ALL CAUGHT UP.</h1><button class="action primary" data-go="deck" data-id="${esc(d.id)}">BACK TO DECK →</button></div></main>`,`<button class="action" data-go="deck" data-id="${esc(d.id)}">EXIT</button>`);return}shell(`<main class="study"><div class="study-head"><span class="meta">${String(Math.min(session.done+1,session.initial)).padStart(2,'0')} / ${String(session.initial).padStart(2,'0')}</span><span class="meta">${cram?'CRAM · ':''}${esc(d.name)}</span></div><div class="study-center" aria-live="polite" aria-atomic="true">${reviewFace(c)}</div><div class="study-actions">${reviewActions()}</div></main>`,`<button class="action" data-go="deck" data-id="${esc(d.id)}">EXIT</button>`)}
function flipCard(){
  if(!session||!['study','cram'].includes(view.name))return;
  const c=findDeck()?.cards.find(c=>c.id===session.queue[0]),center=app.querySelector('.study-center'),actions=app.querySelector('.study-actions');
  if(!c||!center||!actions)return;
  const focused=actions.contains(document.activeElement);
  session.revealed=!session.revealed;
  center.innerHTML=reviewFace(c);actions.innerHTML=reviewActions();safeLinks();
  if(focused)actions.querySelector('[data-flip]').focus({preventScroll:true});
}
function nextCram(){if(view.name!=='cram'||!session?.revealed)return;session.queue.shift();session.done++;session.revealed=false;const focused=app.querySelector('.study-actions')?.contains(document.activeElement);studyView();if(focused)app.querySelector('[data-flip],[data-go="cram"]')?.focus({preventScroll:true})}
function grade(kind){if(grading||view.name!=='study'||!session?.revealed)return;grading=true;try{const d=findDeck(),c=d?.cards.find(x=>x.id===session.queue[0]);if(!c)return;session.queue.shift();const now=Date.now();c.lastReviewed=now;if(kind==='know'){c.interval=Math.min((Number(c.interval)||0)+1,STEPS.length);c.due=now+STEPS[c.interval-1]*DAY;session.done++}else{c.interval=0;c.due=now+5*60000;session.queue.push(c.id)}session.revealed=false;const focused=app.querySelector('.study-actions')?.contains(document.activeElement);studyView();if(focused)app.querySelector('[data-flip],.completion button')?.focus({preventScroll:true});void save()}finally{grading=false}}
function navigate(name,id){notice='';const previous=view;view={name,id};if(name!=='study'&&name!=='cram'||previous.name!==name||previous.id!==id)session=null;if(name==='deck'&&previous.id!==id)cardPage=0;render();window.scrollTo(0,0)}
function render(){if(view.name==='home')home();else if(view.name==='create'||view.name==='add')bulkView();else if(view.name==='deck')deckView();else if(view.name==='study'||view.name==='cram')studyView()}
// Backups: validate the entire replacement before touching current state.
function validate(data){if(!Array.isArray(data)||data.length>10000)throw Error('Backup must contain an array of decks.');const ids=new Set();let total=0;return data.map(d=>{if(!d||typeof d.id!=='string'||!d.id||ids.has(d.id)||typeof d.name!=='string'||!d.name.trim()||d.name.length>160||!Array.isArray(d.cards))throw Error('Invalid deck data or duplicate ID.');ids.add(d.id);total+=d.cards.length;if(total>100000)throw Error('Backup contains too many cards.');return {id:d.id,name:d.name,cards:d.cards.map(c=>{if(!c||typeof c.id!=='string'||!c.id||ids.has(c.id)||typeof c.front!=='string'||!c.front.trim()||typeof c.back!=='string'||!c.back.trim()||!Number.isInteger(c.interval)||c.interval<0||c.interval>STEPS.length||typeof c.due!=='number'||!Number.isFinite(c.due)||!(c.lastReviewed===null||typeof c.lastReviewed==='number'&&Number.isFinite(c.lastReviewed)))throw Error('Invalid card data or duplicate ID.');ids.add(c.id);return {id:c.id,front:c.front,back:c.back,interval:c.interval,due:c.due,lastReviewed:c.lastReviewed}})}})}
function exportData(deck=null){
  const name=deck?(deck.name.replace(/[<>:"/\\|?*\u0000-\u001f]/g,'-').trim().slice(0,100).replace(/[. ]+$/g,'')||'deck'):'';
  const prefix=deck?'flashcards-deck-'+name:'flashcards-backup';
  const blob=new Blob([JSON.stringify(deck?[deck]:decks,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=prefix+'-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
fileInput.addEventListener('change',async()=>{const file=fileInput.files?.[0];fileInput.value='';if(!file)return;try{if(file.size>50*1024*1024)throw Error('Backup is too large.');const restored=validate(JSON.parse(await file.text()));if(decks.length&&!confirm(`Replace ${decks.length} existing deck(s) with ${restored.length} imported deck(s)? This cannot be undone.`))return;decks=restored;if(!await save())return;navigate('home');flash('Import complete.')}catch(e){flash('Import failed: '+e.message)}});
app.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=findDeck();if(b.dataset.page){cardPage+=b.dataset.page==='next'?1:-1;deckView();app.querySelector('.cards')?.scrollIntoView({block:'start'});return}if(b.dataset.go){navigate(b.dataset.go,b.dataset.id);return}if(b.dataset.open){navigate('deck',b.dataset.open);return}if(b.hasAttribute('data-export-deck')&&d)return exportData(d);if(b.hasAttribute('data-export'))return exportData();if(b.hasAttribute('data-import'))return fileInput.click();if(b.hasAttribute('data-rename'))return rename();if(b.hasAttribute('data-cancel-edit'))return deckView();if(b.hasAttribute('data-save-name')){const name=document.getElementById('rename-input').value.trim();if(!name){document.getElementById('rename-input').setCustomValidity('Enter a deck name.');document.getElementById('rename-input').reportValidity();document.getElementById('rename-input').focus();return}d.name=name;await save();deckView();return}if(b.dataset.edit)return editCard(b.dataset.edit);if(b.dataset.saveCard){const row=b.closest('.card-row'),c=d.cards.find(x=>x.id===b.dataset.saveCard),front=row.querySelector('#edit-front').value.trim(),back=row.querySelector('#edit-back').value.trim();if(!front||!back){let error=row.querySelector('.edit-error');if(!error){error=document.createElement('p');error.className='error edit-error';error.setAttribute('role','alert');row.append(error)}error.textContent='Both sides are required.';(front?row.querySelector('#edit-back'):row.querySelector('#edit-front')).focus();return}c.front=front;c.back=back;await save();deckView();return}if(b.dataset.deleteCard){if(!confirm('Delete this card?'))return;d.cards=d.cards.filter(c=>c.id!==b.dataset.deleteCard);await save();deckView();return}if(b.hasAttribute('data-delete-deck')){if(!confirm(`Delete “${d.name}” and all its cards? This cannot be undone.`))return;decks=decks.filter(x=>x.id!==d.id);await save();navigate('home');return}if(b.hasAttribute('data-flip'))return flipCard();if(b.hasAttribute('data-cram-next'))return nextCram();if(b.dataset.grade)grade(b.dataset.grade)});
document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='Escape'){if(view.name==='study'||view.name==='cram')navigate('deck',view.id);else if(view.name==='add')navigate('deck',view.id);else if(view.name==='create')navigate('home');else if(view.name==='deck'&&app.querySelector('#rename-input,.edit-area'))deckView();return}const typing=e.target.closest('input,textarea,[contenteditable]');if(typing){if(e.key==='Enter'&&e.target.id==='rename-input'){e.preventDefault();app.querySelector('[data-save-name]')?.click()}return}if((view.name!=='study'&&view.name!=='cram')||!session?.queue.length)return;if(e.code==='Space'){if(e.target.closest('button')&&!e.target.closest('[data-flip]'))return;e.preventDefault();flipCard()}else if(view.name==='cram'&&session.revealed&&e.key==='ArrowRight'){e.preventDefault();nextCram()}else if(view.name==='study'&&session.revealed&&e.key==='ArrowLeft'){e.preventDefault();grade('miss')}else if(session.revealed&&e.key==='ArrowRight'){e.preventDefault();grade('know')}});
(async()=>{try{db=await openDB();decks=validate(await read());render()}catch(e){app.innerHTML=`<main class="page"><h1>STORAGE UNAVAILABLE.</h1><p>Enable IndexedDB for this page and reload. ${esc(e.message||'')}</p></main>`}})();
</script></body></html>
